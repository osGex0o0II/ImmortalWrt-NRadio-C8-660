name: Update Init Build SHA

on:
  workflow_dispatch:
  schedule:
    - cron: "17 20 * * *"

concurrency:
  group: update-init-build-sha
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: update-init-build-sha
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Projects
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Refresh pinned SHA256
        run: |
          set -euo pipefail

          REF_FILE=".github/init_build_environment.ref"
          PIN_FILE=".github/init_build_environment.sha256"
          REF="$(git ls-remote https://github.com/immortalwrt/build-scripts.git refs/heads/master | cut -f1)"
          [[ "$REF" =~ ^[0-9a-f]{40}$ ]]
          URL="https://raw.githubusercontent.com/immortalwrt/build-scripts/$REF/init_build_environment.sh"

          curl -fsSL --retry 3 "$URL" -o /tmp/init_build_env.sh
          bash -n /tmp/init_build_env.sh
          printf '%s\n' "$REF" > "$REF_FILE"
          sha256sum /tmp/init_build_env.sh | cut -d' ' -f1 > "$PIN_FILE"

      - name: Commit changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if git diff --quiet -- .github/init_build_environment.ref .github/init_build_environment.sha256; then
            echo "No init_build_environment.sh SHA256 change"
            exit 0
          fi

          BRANCH="codex/update-init-build-sha"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add .github/init_build_environment.ref .github/init_build_environment.sha256
          git commit -m "ci: update init build environment sha"
          REMOTE_REF="refs/heads/$BRANCH"
          EXPECTED="$(git ls-remote origin "$REMOTE_REF" | awk '{print $1}')"
          git push --force-with-lease="$REMOTE_REF:$EXPECTED" origin "HEAD:$REMOTE_REF"

          if gh pr view "$BRANCH" --json url --jq .url >/tmp/init-sha-pr-url 2>/dev/null; then
            echo "Updated existing init-build-sha PR: $(cat /tmp/init-sha-pr-url)"
          elif gh pr create \
              --base "${{ github.ref_name }}" \
              --head "$BRANCH" \
              --title "ci: update init build environment sha" \
              --body "Updates init_build_environment.sh SHA256 pin for manual review before it becomes the build baseline."; then
            echo "Created init-build-sha PR for review"
          else
            echo "::warning::GitHub Actions cannot open pull requests in this repository (Actions PR permission is disabled)."
            echo "::warning::The refreshed locks are committed on branch $BRANCH but were NOT applied to ${{ github.ref_name }}."
            echo "::warning::Review and merge manually: https://github.com/${{ github.repository }}/compare/${{ github.ref_name }}...$BRANCH?expand=1"
            echo "::warning::Enable 'Allow GitHub Actions to create and approve pull requests' to let this job open the pull request itself."
          fi
