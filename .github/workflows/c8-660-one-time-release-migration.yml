name: C8-660 Migration History Cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/c8-660-one-time-release-migration.yml

permissions:
  contents: read
  actions: write

jobs:
  cleanup:
    if: github.repository == 'osGex0o0II/ImmortalWrt-NRadio-C8-660' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Delete superseded migration attempts
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          for id in 43800037602 43800067493 43800077759 43800135503 43800735757; do
            result="$(gh api "repos/$repo/actions/runs/$id" --jq '.name + "|" + .status' 2>/dev/null || true)"
            if [[ "$result" == 'C8-660 One-Time Release Migration|completed' ]]; then
              gh api -X DELETE "repos/$repo/actions/runs/$id"
              echo "Deleted superseded migration run $id"
            else
              echo "::warning::Preserved run $id: unexpected state ($result)"
            fi
          done
